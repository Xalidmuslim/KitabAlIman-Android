          assert 'R.drawable.iman_v43_approved_scroll' in quote_v30
          assert 'R.drawable.iman_v42_manuscript_qalam' not in quote_v30
          art=root/'app/src/main/res/drawable-nodpi/iman_v43_approved_scroll.webp'
          assert art.stat().st_size > 3000
          from PIL import Image
          with Image.open(art) as im:
