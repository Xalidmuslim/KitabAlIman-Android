      - name: Kotlin excerpt for precise diagnostics
        run: |
          nl -ba AndroidApp/app/src/main/java/com/xalid/meditsinaproroka/nativeapp/Reader.kt | sed -n '120,210p'

      - name: Native unit tests
        working-directory: AndroidApp
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Release APK with R8
        working-directory: AndroidApp
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and embedded text
        run: |
          set -euo pipefail
          APK=AndroidApp/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          if unzip -Z1 "$APK" | grep -Ei '\.pdf$'; then
            echo 'ERROR: PDF file bundled in APK'
            exit 1
          fi
          unzip -p "$APK" assets/book.json | cmp - AndroidApp/app/src/main/assets/book.json
          unzip -p "$APK" assets/quiz.json | cmp - AndroidApp/app/src/main/assets/quiz.json
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package:'
          sha256sum "$APK"

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KitabAlIman-v0.45.0-Release-APK
          path: AndroidApp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      # Real emulator screenshot QA; failed launch must not masquerade as success.
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      # Preview-only screenshot QA on a fresh emulator; independent from APK signing.
      - name: Render Home on Android emulator for visual QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            adb install AndroidApp/app/build/outputs/apk/release/app-release.apk
            adb shell wm size 432x768
            adb shell wm density 160
            adb shell settings put system font_scale 1.0
            # The approved user reference uses gesture navigation. Try the same
            # Android system mode; retain a usable fallback on older emulator images.
            adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural || true
            adb shell settings put secure navigation_mode 2 || true
            adb shell am start -W -n com.xalid.kitabaliman.preview45/com.xalid.meditsinaproroka.nativeapp.MainActivity
            sleep 9
            mkdir -p qa
            adb shell screencap -p /sdcard/iman_v45_home.png
            adb pull /sdcard/iman_v45_home.png qa/iman_v45_home.png
            # Rotate through the actual long (179-character) chapter excerpt.
            # Font identity and relief are also asserted on every rendering path above.
            for n in $(seq 1 8); do adb shell input tap 382 105; done
            sleep 2
            adb shell screencap -p /sdcard/iman_v45_quote_long.png
            adb pull /sdcard/iman_v45_quote_long.png qa/iman_v45_quote_long.png

            # The remaining screenshots are taken from the installed native APK,
            # not design mockups. All routes share the same bottom navigation.
            adb shell input tap 130 721
            sleep 2
            adb shell screencap -p /sdcard/iman_v45_contents.png
            adb pull /sdcard/iman_v45_contents.png qa/iman_v45_contents.png
            adb shell input tap 215 721
            sleep 2
            adb shell screencap -p /sdcard/iman_v45_search.png
            adb pull /sdcard/iman_v45_search.png qa/iman_v45_search.png
            adb shell input tap 302 721
            sleep 2
            adb shell screencap -p /sdcard/iman_v45_bookmarks.png
            adb pull /sdcard/iman_v45_bookmarks.png qa/iman_v45_bookmarks.png
            adb shell input tap 387 721
            sleep 2
            adb shell screencap -p /sdcard/iman_v45_more.png
            adb pull /sdcard/iman_v45_more.png qa/iman_v45_more.png
            adb shell input tap 396 60
            sleep 2
            adb shell screencap -p /sdcard/iman_v45_settings.png
            adb pull /sdcard/iman_v45_settings.png qa/iman_v45_settings.png
            adb shell input tap 130 721
            sleep 2
            adb shell input tap 185 284
            sleep 2
            adb shell screencap -p /sdcard/iman_v45_reader.png
            adb pull /sdcard/iman_v45_reader.png qa/iman_v45_reader.png
            adb shell input tap 45 721
            sleep 2

            # Small display QA: longer Russian text with 10% larger system font.
            adb shell wm size 360x800
            adb shell wm density 160
            adb shell settings put system font_scale 1.10
            sleep 2
            adb shell screencap -p /sdcard/iman_v45_home_small.png
            adb pull /sdcard/iman_v45_home_small.png qa/iman_v45_home_small.png

      - name: Export generated icon and parchment relief for visual review
        if: always()
        run: |
          mkdir -p qa
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('AndroidApp/app/src/main/res/drawable-nodpi')
          for name in ('iman_v39_header','iman_v43_approved_scroll'):
              source=root/(name+'.webp')
              if source.is_file():
                  Image.open(source).save(Path('qa')/(name+'_asset.png'))
          PY

      - name: Upload actual-emulator Home screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KitabAlIman-v0.45.0-Visual-QA
          path: qa/iman_v45_*.png
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct-download GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.45.0
          APK=AndroidApp/app/build/outputs/apk/release/app-release.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Книга Имана v0.45.0" --notes "Напоминания: иллюстрация без искусственной прозрачности, полный контраст оригинального матового 3D, текст и изображение в отдельных колонках без наложения. Все 79 цитат, 131 глава, главный экран и остальные разделы сохранены. Отдельная тестовая установка preview45."
          fi
          gh release upload "$TAG" "$APK#KitabAlIman-v0.45.0.apk" --clobber
