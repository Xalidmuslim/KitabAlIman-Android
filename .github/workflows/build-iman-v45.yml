          assert (root/'app/src/main/res/drawable-nodpi/iman_quote_v15.webp').stat().st_size > 10000
          assert 'ImanFeaturedQuoteCarousel(navigate)' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'private fun ReaderChapterSpeechBar(' in reader
          assert 'private fun ReaderChapterSpeechBar(' in reader
          quote_data = json.loads((root/'app/src/main/assets/featured_quotes.json').read_text(encoding='utf-8'))
          assert len(quote_data)==79
          assert len(set(q['text'] for q in quote_data))==79
          assert len(set(q['chapterId'] for q in quote_data))>=50
          assert 'heightIn(min = 76.dp)' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
