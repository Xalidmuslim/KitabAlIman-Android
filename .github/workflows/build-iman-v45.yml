name: Build Kitab al-Iman v0.45.0 reminder clarity and wrap

on:
  push:
    branches:
      - codex/iman-reminder-contrast-wrap-v45-20261109
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Kitab al-Iman
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Expand and verify the native v0.4 patch source
        run: python3 scripts/unpack_v4.py

      - name: Unpack verified v0.6 reading and study sources
        run: python3 scripts/unpack_v6.py

      - name: Install Pillow for verified source artwork
        run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0 numpy==2.2.6 fonttools==4.60.1 brotli

      - name: Create paper texture from approved reference (first run only)
        run: |
          set -euo pipefail
          if [ ! -s assets/ui/v29/iman_v29_unified_home.webp ]; then
            python3 -m scripts.iman_v29_generate_paper
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/ui/v29/iman_v29_unified_home.webp
            git commit -m "assets: approved textured parchment committed [skip ci]"
            git push origin HEAD:codex/iman-pixel-reference-v29-20261108
          fi

      - name: Test book preservation, quotes and navigation
        run: python3 -m unittest discover -s tests -v

      - name: Test v39 permanent reminder and Android launcher contracts
        run: python3 -m unittest discover -s tests -p 'test_iman_v39.py' -v

      - name: Targeted v40 layout and drawing regression tests
        run: python3 -m unittest discover -s tests -p 'test_iman_v40.py' -v

      - name: Targeted v41 chart and contour regression tests
        run: python3 -m unittest discover -s tests -p 'test_iman_v41.py' -v

      - name: Targeted v42 manuscript, route and readability contracts
        run: python3 -m unittest discover -s tests -p 'test_iman_v42.py' -v

      - name: Targeted v43 approved-art and continuity regression tests
        run: python3 -m unittest discover -s tests -p 'test_iman_v43.py' -v

      - name: Unified paper routing and non-destructive user state tests
        run: python3 -m unittest discover -s tests -p 'test_iman_v45.py' -v

      - name: Prepare native v0.45.0 application
        run: python3 -m scripts.build_iman_v45 --dest AndroidApp

      - name: Check transformed source and data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('AndroidApp')
          book = json.loads((root/'app/src/main/assets/book.json').read_text(encoding='utf-8'))
          blocks = [b for c in book['chapters'] for b in c['blocks']]
          assert len(book['chapters']) == 131
          assert len(blocks) == 1795
          assert sum(b['type']=='footnote' for b in blocks) == 242
          assert sum(b['type']=='verse' for b in blocks) == 3
          assert sum(b['type']=='hadith' for b in blocks) >= 15
          assert all(not c['section'] for c in book['chapters'])
          assert not any(b['type']=='quran' for b in blocks)
          assert sum(len(b.get('footnoteOffsets',[])) for b in blocks) == 242
          quiz = json.loads((root/'app/src/main/assets/quiz.json').read_text(encoding='utf-8'))
          assert len(quiz['chapters']) == 131
          assert sum(len(q) for q in quiz['chapters'].values()) == 524
          src = root/'app/src/main/java/com/xalid/meditsinaproroka/nativeapp'
          reader=(src/'Reader.kt').read_text(encoding='utf-8')
          screens=(src/'Screens.kt').read_text(encoding='utf-8')
          app=(src/'App.kt').read_text(encoding='utf-8')
          home=(src/'AntiqueDesign.kt').read_text(encoding='utf-8')
          menu=(src/'WebDesign.kt').read_text(encoding='utf-8')
          assert 'sameChapterHeading(chapter.title, block.text)' in reader
          assert 'FaithSourceCard(chapter, block, store)' in reader
          assert 'ScriptureParagraph(chapter, block, store)' in reader
          assert 'citedVerseSlices(text: String)' in reader
          assert 'while (end < text.length && text[end] in ".,;:!?") end++' in reader
          assert 'while (end < text.length && text[end].isWhitespace()) end++' in reader
          assert (root/'app/src/test/java/com/xalid/meditsinaproroka/nativeapp/ImanReaderV7Test.kt').is_file()
          assert 'compactFootnote: Boolean = false' in reader
          assert 'val sourceStart: Int = 0' in reader
          assert 'fontSize = if (centeredTitle) 16.5.sp else 16.sp' in screens
          assert 'fontSize = 15.sp' in screens
          assert 'TextAlign.Start' in screens
          assert 'Modifier.size(38.dp)' in screens
