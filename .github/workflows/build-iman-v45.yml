          assert 'heightIn(min = if (compactScreen) 111.dp else 133.dp)' in quote_v30
          assert 'width(if (compactScreen) 112.dp else 148.dp)' in quote_v30
          assert 'showIllustration' not in quote_v30
          assert 'R.drawable.iman_v17_quote' not in quote_v30
          assert 'R.drawable.iman_v38_flat_paper' in app
          assert app.count('ImanUnifiedRouteTheme(isHome = route == Route.Home)') == 1
          assert 'if (MaterialTheme.colorScheme.background.red >= 0.25f) {' in app
          assert 'seamlessHome = seamlessHome || current != Route.Home' in app
          assert 'padding(bottom = 72.dp)' in app
          assert 'bottom = 24.dp' in (src/'IbnQayyimStyle.kt').read_text('utf-8')
