          assert 'R.drawable.iman_v43_approved_scroll' in quote_v30
          assert (root/'app/src/main/res/drawable-nodpi/iman_v41_engraving.webp').stat().st_size > 1000
          assert '22.5.sp' in quote_v30 and '20.5.sp' in quote_v30
          assert '19.sp' in quote_v30 and '17.5.sp' in quote_v30
          assert home_v30.count('EditorialBookSection(') == 5  # 1 declaration + four uses
          assert 'EditorialBookSection("Заметки"' not in home_v30
          assert 'R.drawable.iman_v39_header' in home_v30
          assert 'R.drawable.medicine_launcher_book' not in home_v30
          assert 'fontFamily = ImanCaveatFont' in quote_v30
          assert 'fontFamily = if (length' not in quote_v30
          assert 'R.drawable.iman_v43_approved_scroll' in quote_v30
          assert 'if (showIllustration)' not in quote_v30
          assert (root/'app/src/main/res/drawable-nodpi/iman_v39_relief.webp').stat().st_size > 1000
          assert (root/'app/src/main/res/drawable-nodpi/iman_v39_header.webp').stat().st_size > 1000
          assert (root/'app/src/main/res/mipmap-anydpi-v26/iman_v39_launcher.xml').is_file()
          assert '@mipmap/iman_v39_launcher' in (root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')

          assert 'EditorialBookSection("Хадисы", "Источники"' in home_v30
          assert 'R.drawable.iman_v35_bookmarks' in home_v30
          assert 'Route.Hadiths' in home_v30
          assert 'EditorialBookSection("Закладки"' not in home_v30
          assert (root/'app/src/main/res/drawable-nodpi/iman_v38_notes.webp').stat().st_size > 1000
          assert (root/'app/src/main/res/drawable-nodpi/iman_v38_reminder.webp').stat().st_size > 1000
          assert (root/'app/src/main/res/drawable-nodpi/iman_v38_flat_paper.webp').stat().st_size > 3000
          assert 'Text("$minutes"' in (src/'ReadingStatisticsV36.kt').read_text(encoding='utf-8')
          assert 'Arrangement.SpaceBetween' not in (src/'ReadingStatisticsV36.kt').read_text(encoding='utf-8')

