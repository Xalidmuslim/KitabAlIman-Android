name: Build Kitab al-Iman APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout book project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use runner preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Check complete text, footnotes and no PDF
        run: python3 -m unittest discover -s tests -v

      - name: Prepare pinned native Kotlin/Compose Android source
        run: python3 scripts/assemble_app.py --dest AndroidApp

      - name: Compile Android and run unit tests
        working-directory: AndroidApp
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build minified signed release APK
        working-directory: AndroidApp
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Check release artifact, signature and installed book data
        run: |
          set -euo pipefail
          APK=AndroidApp/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          if unzip -Z1 "$APK" | grep -E -i '\.pdf$'; then
            echo 'ERROR: PDF found in the APK'
            exit 1
          fi
          unzip -p "$APK" assets/book.json | cmp - AndroidApp/app/src/main/assets/book.json
          python3 - <<'PY'
          import json, pathlib
          book = json.loads(pathlib.Path('AndroidApp/app/src/main/assets/book.json').read_text(encoding='utf-8'))
          blocks = [block for chapter in book['chapters'] for block in chapter['blocks']]
          assert len(book['chapters']) == 131
          assert len(blocks) == 1795
          assert sum(block['type'] == 'footnote' for block in blocks) == 242
          assert not any(block['type'] == 'quran' for block in blocks)
          for ref in ('3:102', '4:1', '33:70–71'):
              assert any('[' + ref + ']' in block['text'] for block in blocks)
          print('PASS: Only Russian Quran translations, 242 footnotes, 131 chapters')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package:'
          sha256sum "$APK"

      - name: Publish downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitabAlIman-Release-APK
          path: AndroidApp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
