name: Build Kitab al-Iman v0.23.0

on:
  push:
    branches:
      - main
      - codex/iman-reader-ui-20261106
      - codex/ibn-qayyim-ui-port-20261107
      - codex/ibn-v38-engine-20261107
      - codex/v38-screen-parity-20261107
      - codex/iman-v14-quote-art-20261107
      - codex/iman-reminder-background-v15-20261107
      - codex/iman-v16-quotes-compact-20261107
      - codex/iman-v17-light-art-20261107
      - codex/iman-modern-editorial-v18-20261107
      - codex/iman-editorial-premium-v19-20261107
      - codex/iman-art-directed-v20-20261108
      - codex/iman-borderless-editorial-v21-20261108
      - codex/iman-reading-paper-v22-20261108
      - codex/iman-editorial-variant4-v23-20261108
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Kitab al-Iman
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Expand and verify the native v0.4 patch source
        run: python3 scripts/unpack_v4.py

      - name: Unpack verified v0.6 reading and study sources
        run: python3 scripts/unpack_v6.py

      - name: Install Pillow for verified source artwork
        run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Test book preservation, quotes and navigation
        run: python3 -m unittest discover -s tests -v

      - name: Prepare native v0.23.0 application
        run: python3 -m scripts.build_iman_v23 --dest AndroidApp

      - name: Check transformed source and data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('AndroidApp')
          book = json.loads((root/'app/src/main/assets/book.json').read_text(encoding='utf-8'))
          blocks = [b for c in book['chapters'] for b in c['blocks']]
          assert len(book['chapters']) == 131
          assert len(blocks) == 1795
          assert sum(b['type']=='footnote' for b in blocks) == 242
          assert sum(b['type']=='verse' for b in blocks) == 3
          assert sum(b['type']=='hadith' for b in blocks) >= 15
          assert all(not c['section'] for c in book['chapters'])
          assert not any(b['type']=='quran' for b in blocks)
          assert sum(len(b.get('footnoteOffsets',[])) for b in blocks) == 242
          quiz = json.loads((root/'app/src/main/assets/quiz.json').read_text(encoding='utf-8'))
          assert len(quiz['chapters']) == 131
          assert sum(len(q) for q in quiz['chapters'].values()) == 524
          src = root/'app/src/main/java/com/xalid/meditsinaproroka/nativeapp'
          reader=(src/'Reader.kt').read_text(encoding='utf-8')
          screens=(src/'Screens.kt').read_text(encoding='utf-8')
          app=(src/'App.kt').read_text(encoding='utf-8')
          home=(src/'AntiqueDesign.kt').read_text(encoding='utf-8')
          menu=(src/'WebDesign.kt').read_text(encoding='utf-8')
          assert 'sameChapterHeading(chapter.title, block.text)' in reader
          assert 'FaithSourceCard(chapter, block, store)' in reader
          assert 'ScriptureParagraph(chapter, block, store)' in reader
          assert 'citedVerseSlices(text: String)' in reader
          assert 'while (end < text.length && text[end] in ".,;:!?") end++' in reader
          assert 'while (end < text.length && text[end].isWhitespace()) end++' in reader
          assert (root/'app/src/test/java/com/xalid/meditsinaproroka/nativeapp/ImanReaderV7Test.kt').is_file()
          assert 'compactFootnote: Boolean = false' in reader
          assert 'val sourceStart: Int = 0' in reader
          assert 'fontSize = if (centeredTitle) 16.5.sp else 16.sp' in screens
          assert 'fontSize = 15.sp' in screens
          assert 'TextAlign.Start' in screens
          assert 'Modifier.size(38.dp)' in screens
          assert 'TextAlign.Center' in reader
          assert '21 else 24' in reader
          assert 'FaithChapterQuiz(chapter = chapter, store = store)' in reader
          assert 'EditionFootnoteSpan' in reader
          assert 'isBookSectionMarker(block.text)' in reader
          assert 'V38ReadingSession(chapter = chapter, scrollState = scrollState)' in reader
          assert 'V38ReaderStatus(chapter = chapter, store = store)' in reader
          assert (src/'FaithStudy.kt').is_file()
          assert 'Route.Progress' in app
          assert 'Прогресс чтения' in menu
          assert (src.parent.parent.parent/'test/java/com/xalid/meditsinaproroka/nativeapp/ImanReaderV4Test.kt').is_file() or (root/'app/src/test/java/com/xalid/meditsinaproroka/nativeapp/ImanReaderV4Test.kt').is_file()
          assert 'PageHeader("Оглавление"' in screens
          assert 'NavItem("Оглавление"' in app
          assert 'Route.Treatments' not in home
          assert 'antique_mortar_detail' not in home
          assert 'antique_remedies_detail' not in home
          assert 'Route.Treatments' not in menu
          assert 'Route.Remedies' not in menu
          assert 'val bannerHeight = maxWidth / 3f' in home
          assert 'ContentScale.FillBounds' in home
          assert 'Icons.Default.Settings' in home
          assert 'Шейхуль-Ислам Ибн Таймийя' in home
          assert 'IbnStyleHomeScreen(book, store, modifier' in home
          assert 'Route.Book -> IbnStyleContentsScreen(' in app
          assert 'Route.Progress -> V38StatisticsScreen(' in app
          assert (src/'IbnV38StudyEngine.kt').is_file()
          assert (src/'IbnQayyimStyle.kt').is_file()
          assert 'NavItem("Оглавление", R.drawable.nav_topics' in app
          # Borderless native shell: five preserved tab routes with no old paper plaque.
          nav = app.split('@Composable\nprivate fun StandaloneBottomNav(', 1)[1]
          assert 'val panelShape = RoundedCornerShape(0.dp)' in nav
          assert '.border(' not in nav and 'antique_card_paper' not in nav
          assert all(item in nav for item in (
              'NavItem("Главная"', 'NavItem("Оглавление"',
              'NavItem("Поиск"', 'NavItem("Закладки"', 'NavItem("Ещё"'))
          home_v23 = (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          quote_v23 = (src/'ImanQuoteCarousel.kt').read_text(encoding='utf-8')
          assert 'border = null' in home_v23 and 'shadowElevation = 0.dp' in home_v23
          assert 'Color(0xFFFCF8F3)' in home_v23
          assert 'readerPaperOverlay(' not in home_v23
          assert 'reader_parchment_source' not in home_v23
          assert 'EditorialOrnamentDivider(' in home_v23
          assert 'Brush.horizontalGradient' not in home_v23
          assert 'border = null' in quote_v23 and 'shadowElevation = 0.dp' in quote_v23
          assert 'reader_parchment_source' not in quote_v23
          assert 'R.drawable.iman_v17_quote' not in quote_v23
          assert 'Color(0xFFFCF8F3)' in nav
          for name in ('contents','collections','glossary','bookmarks'):
              assert 'R.drawable.iman_v23_' + name in home_v23
              assert (root/'app/src/main/res/drawable-nodpi'/('iman_v23_' + name + '.webp')).stat().st_size > 350
          assert 'Route.More -> ImanV38MoreScreen(screenModifier, ::navigate)' in app
          assert 'ЛИЧНАЯ БИБЛИОТЕКА' in (src/'ImanV38More.kt').read_text(encoding='utf-8')
          quotes=(src/'ImanQuoteCarousel.kt').read_text(encoding='utf-8')
          assert 'Другая ↻' in quotes
          assert quotes.count('FeaturedExcerpt("iman-chapter-')==79
          assert 'R.drawable.reader_parchment_source' not in quotes
          assert 'R.drawable.iman_v17_quote' not in quotes
          assert 'maxLines = 5' in quotes
          assert 'ModernEditorialHomeScreen(book, store, modifier' in (src/'IbnQayyimStyle.kt').read_text(encoding='utf-8')
          assert 'SepiaMiniStat(' not in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'R.drawable.iman_v17_contents' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'Route.Progress' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'ContentScale.FillBounds' not in quotes
          assert 'Crossfade(' in quotes
          assert 'Brush.horizontalGradient' not in quotes
          assert quotes.index('Text("Другая ↻"') < quotes.index('imanExcerpts[itemIndex].text')
          assert (root/'app/src/main/res/drawable-nodpi/iman_quote_v15.webp').stat().st_size > 10000
          assert 'ImanFeaturedQuoteCarousel(navigate)' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'private fun ReaderChapterSpeechBar(' in reader
          assert 'BorderStroke(0.8.dp' in reader
          quote_data = json.loads((root/'app/src/main/assets/featured_quotes.json').read_text(encoding='utf-8'))
          assert len(quote_data)==79
          assert len(set(q['text'] for q in quote_data))==79
          assert len(set(q['chapterId'] for q in quote_data))>=50
          assert 'heightIn(min = 74.dp)' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'EditorialResumeCard(' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'Crossfade(' in quotes
          assert 'width = 62.dp, height = 64.dp' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'Route.Book' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'Route.Bookmarks' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'Бесплатный нейроголос RuVoice (установка)' not in reader
          from scripts.build_iman_v17 import ART
          for art_name in ART:
              assert (root/'app/src/main/res/drawable-nodpi'/art_name).is_file()
          assert 'height(2.dp)' in (src/'IbnV38StudyEngine.kt').read_text(encoding='utf-8')
          assert all((root/'app/src/main/res/drawable-nodpi'/n).stat().st_size>9000
            for n in ('iman_quote_background.webp','iman_section_contents.webp',
              'iman_section_collections.webp','iman_section_glossary.webp',
              'iman_section_bookmarks.webp'))
          assert 'Color(0xFF8E6832)' in home
          assert 'Color(0xFFF9DFBC)' in home
          assert 'ImanHomeCollectionCard' in home
          assert 'val bannerHeight = maxWidth / 3f' in home
          assert 'Route.Glossary' in (src/'ModernEditorialHome.kt').read_text(encoding='utf-8')
          assert 'width = 105.dp, height = 89.dp' in home
          from scripts.build_iman_v9 import RESOURCE_MAP
          import hashlib
          assert len(RESOURCE_MAP) == 7
          art_folder = root/'app/src/main/res/drawable-nodpi'
          for output_file, input_file, expected_sha, size in RESOURCE_MAP:
              target = art_folder/output_file
              assert hashlib.sha256(target.read_bytes()).hexdigest() == expected_sha, output_file
          assert 'R.drawable.iman_glossary_detail' in (src/'MedicineHomeArtwork.kt').read_text(encoding='utf-8')
          assert (root/'app/src/main/res/drawable-nodpi/antique_hero_refined.webp').stat().st_size > 20000
          assert (root/'app/src/main/res/drawable-nodpi/medicine_launcher_book.webp').stat().st_size > 15000
          assert not list((root/'app/src/main').rglob('*.pdf'))
          print('PASS: 131 chapters, 242 footnotes, compact contents, no medical links or PDF')
          PY

      - name: Kotlin excerpt for precise diagnostics
        run: |
          nl -ba AndroidApp/app/src/main/java/com/xalid/meditsinaproroka/nativeapp/Reader.kt | sed -n '120,210p'

      - name: Native unit tests
        working-directory: AndroidApp
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Release APK with R8
        working-directory: AndroidApp
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and embedded text
        run: |
          set -euo pipefail
          APK=AndroidApp/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          if unzip -Z1 "$APK" | grep -Ei '\.pdf$'; then
            echo 'ERROR: PDF file bundled in APK'
            exit 1
          fi
          unzip -p "$APK" assets/book.json | cmp - AndroidApp/app/src/main/assets/book.json
          unzip -p "$APK" assets/quiz.json | cmp - AndroidApp/app/src/main/assets/quiz.json
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package:'
          sha256sum "$APK"

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KitabAlIman-v0.23.0-Release-APK
          path: AndroidApp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct-download GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.23.0
          APK=AndroidApp/app/build/outputs/apk/release/app-release.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Книга Имана v0.23.0" --notes "Четвёртый дизайн: без рамок, чистый фон, тонкие разделители и четыре новые матовые иконки библиотеки."
          fi
          gh release upload "$TAG" "$APK#KitabAlIman-v0.23.0.apk" --clobber
